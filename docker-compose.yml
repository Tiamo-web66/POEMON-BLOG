services:
  mysql:
    image: mysql:8.0
    container_name: tiamo-blog-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-tiamo_root_password}
      MYSQL_DATABASE: ${DB_NAME:-myblog}
      MYSQL_USER: ${MYSQL_APP_USER:-blog}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-tiamo_blog_password}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init-schema.sh:/docker-entrypoint-initdb.d/01-schema.sh:ro
      - ./My-Blog-Go/database/schema.sql:/docker-schema/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - tiamo_blog

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/tiamo-web66/tiamo-blog-backend:latest}
    container_name: tiamo-blog-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_APP_USER:-blog}
      DB_PASSWORD: ${MYSQL_APP_PASSWORD:-tiamo_blog_password}
      DB_NAME: ${DB_NAME:-myblog}
      JWT_SECRET: ${JWT_SECRET:-tiamo_docker_change_me}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-smtp.qq.com}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-465}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_URL: ${AI_API_URL:-https://api.deepseek.com/v1}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      SITE_NAME: ${SITE_NAME:-TiAmo-Blog}
      SITE_URL: ${SITE_URL:-http://localhost}
      BOSS_WECHAT: ${BOSS_WECHAT:-}
      EMAIL_HEADER_IMAGE: ${EMAIL_HEADER_IMAGE:-}
      WEATHER_API_ID: ${WEATHER_API_ID:-}
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://127.0.0.1}
      SERVER_PORT: 8000
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEFAULT_SORT_ID: ${DEFAULT_SORT_ID:-11}
      DEFAULT_LABEL_ID: ${DEFAULT_LABEL_ID:-23}
      MAX_USERNAME_LENGTH: ${MAX_USERNAME_LENGTH:-50}
      MAX_PASSWORD_LENGTH: ${MAX_PASSWORD_LENGTH:-128}
      MIN_PASSWORD_LENGTH: ${MIN_PASSWORD_LENGTH:-6}
      MAX_ARTICLE_TITLE_LENGTH: ${MAX_ARTICLE_TITLE_LENGTH:-200}
      MAX_COMMENT_LENGTH: ${MAX_COMMENT_LENGTH:-2000}
      MAX_TREEHOLE_LENGTH: ${MAX_TREEHOLE_LENGTH:-500}
      DB_LOG_SQL: ${DB_LOG_SQL:-false}
      TZ: ${TZ:-Asia/Shanghai}
    expose:
      - "8000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - tiamo_blog

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/tiamo-web66/tiamo-blog-frontend:latest}
    container_name: tiamo-blog-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - tiamo_blog

volumes:
  mysql_data:

networks:
  tiamo_blog:
    driver: bridge
